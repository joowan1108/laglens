<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2185b"/>
    </marker>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#999" stroke-width="1.5"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="1200" height="660" fill="#fff"/>
  <!-- header -->
  <rect x="8" y="8" width="1184" height="40" rx="4" fill="#f3f3f3" stroke="#555"/>
  <text x="20" y="34" font-size="18" font-weight="bold">LagLens</text>
  <rect x="120" y="16" width="190" height="24" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="130" y="32">R  Reference: sync · d0 · h8 ▾</text>
  <rect x="320" y="16" width="200" height="24" rx="12" fill="#fff" stroke="#E69F00" stroke-width="2"/>
  <text x="330" y="32">C  Candidate: naive · d4 · h8 ▾</text>
  <text x="540" y="32">Matrix colour: ( ● success  ○ seam gap  ○ staleness  ○ idle )</text>
  <rect x="1040" y="16" width="60" height="24" rx="4" fill="#fff" stroke="#555"/><text x="1056" y="32">? Help</text>
  <rect x="1110" y="16" width="70" height="24" rx="4" fill="#fff" stroke="#555"/><text x="1126" y="32">↺ Reset</text>

  <!-- A schedule matrix -->
  <rect x="8" y="56" width="330" height="270" rx="4" fill="none" stroke="#555"/>
  <text x="16" y="74" font-weight="bold">A · Schedule Matrix</text>
  <g transform="translate(30,92)">
    <g id="sm">
      <text x="0" y="0" font-size="11">Sync</text>
      <g transform="translate(0,6)">
        <rect width="18" height="18" fill="#2a788e"/><rect x="19" width="18" height="18" fill="#22a884"/><rect x="38" width="18" height="18" fill="#7ad151"/><rect x="57" width="18" height="18" fill="#bddf26"/><rect x="76" width="18" height="18" fill="#fde725"/>
        <rect y="19" width="18" height="18" fill="#2a788e"/><rect x="19" y="19" width="18" height="18" fill="#22a884"/><rect x="38" y="19" width="18" height="18" fill="#43bf71"/><rect x="57" y="19" width="18" height="18" fill="#7ad151"/><rect x="76" y="19" width="18" height="18" fill="#bddf26"/>
        <rect y="38" width="18" height="18" fill="#21918c"/><rect x="19" y="38" width="18" height="18" fill="#2a788e"/><rect x="38" y="38" width="18" height="18" fill="#22a884"/><rect x="57" y="38" width="18" height="18" fill="#43bf71"/><rect x="76" y="38" width="18" height="18" fill="#7ad151"/>
        <rect y="57" width="18" height="18" fill="#21918c"/><rect x="19" y="57" width="18" height="18" fill="#21918c"/><rect x="38" y="57" width="18" height="18" fill="#2a788e"/><rect x="57" y="57" width="18" height="18" fill="#22a884"/><rect x="76" y="57" width="18" height="18" fill="#22a884"/>
        <rect y="57" width="18" height="18" fill="none" stroke="#111" stroke-width="3"/>
      </g>
    </g>
    <use href="#sm" x="100"/><use href="#sm" x="200"/>
    <text x="100" y="0" font-size="11" fill="#fff">Sync</text>
    <rect x="98" y="-12" width="80" height="16" fill="#fff"/><text x="100" y="0" font-size="11">Naive async</text>
    <rect x="198" y="-12" width="80" height="16" fill="#fff"/><text x="200" y="0" font-size="11">Inpaint async</text>
    <rect x="176" y="63" width="18" height="18" fill="none" stroke="#E69F00" stroke-width="3"/>
    <text x="0" y="98" font-size="10">x: latency d (0,1,2,4,6 steps)   y: exec. horizon h (2…8)</text>
    <text x="0" y="112" font-size="10">cell colour: metric chosen in header (viridis)</text>
  </g>
  <text x="16" y="230" font-size="11" fill="#c2185b">click cell → set Candidate (orange ring)</text>
  <text x="16" y="246" font-size="11" fill="#c2185b">shift-click → set Reference (black ring)</text>
  <text x="16" y="262" font-size="11" fill="#c2185b">hover → tooltip (success, seam gap, staleness, idle)</text>
  <text x="16" y="278" font-size="11" fill="#c2185b">radio in header → change colour metric</text>

  <!-- E scatter -->
  <rect x="8" y="334" width="330" height="318" rx="4" fill="none" stroke="#555"/>
  <text x="16" y="352" font-weight="bold">E · Paired Trade-off Scatter</text>
  <line x1="50" y1="620" x2="320" y2="620" stroke="#333"/><line x1="50" y1="370" x2="50" y2="620" stroke="#333"/>
  <text x="140" y="642" font-size="10">mean seam gap (px) →</text>
  <text x="16" y="520" font-size="10" transform="rotate(-90 26 500)">final coverage →</text>
  <g stroke="#bbb">
    <line x1="90" y1="560" x2="190" y2="470"/><line x1="110" y1="590" x2="200" y2="540"/><line x1="80" y1="520" x2="230" y2="420"/><line x1="130" y1="575" x2="210" y2="500"/>
  </g>
  <g>
    <circle cx="90" cy="560" r="5" fill="#333"/><circle cx="110" cy="590" r="5" fill="#333"/><circle cx="80" cy="520" r="5" fill="none" stroke="#333" stroke-width="2"/><circle cx="130" cy="575" r="5" fill="#333"/>
    <circle cx="190" cy="470" r="5" fill="none" stroke="#E69F00" stroke-width="2"/><circle cx="200" cy="540" r="5" fill="#E69F00"/><circle cx="230" cy="420" r="5" fill="none" stroke="#E69F00" stroke-width="2"/><circle cx="210" cy="500" r="5" fill="#E69F00"/>
  </g>
  <rect x="170" y="410" width="80" height="80" fill="#c2185b" fill-opacity="0.08" stroke="#c2185b" stroke-dasharray="4 3"/>
  <text x="60" y="390" font-size="10">● success  ○ failure   black = R, orange = C</text>
  <text x="60" y="404" font-size="10">grey segment links the same initial state (R→C)</text>
  <text x="200" y="600" font-size="11" fill="#c2185b">brush → select seeds</text>

  <!-- B flip matrix -->
  <rect x="346" y="56" width="240" height="596" rx="4" fill="none" stroke="#555"/>
  <text x="354" y="74" font-weight="bold">B · Paired Flip Matrix</text>
  <text x="354" y="90" font-size="10">columns = 46 schedules + noise replicate</text>
  <text x="354" y="102" font-size="10">rows = 50 initial states, sorted by robustness</text>
  <g transform="translate(372,112)">
    <rect width="200" height="460" fill="#d9d9d9"/>
    <rect width="200" height="140" fill="#eeeeee"/>
    <rect y="300" width="200" height="160" fill="#8c8c8c"/>
    <rect x="40" y="150" width="70" height="40" fill="#D55E00"/>
    <rect x="120" y="190" width="60" height="30" fill="#D55E00"/>
    <rect x="10" y="250" width="30" height="20" fill="#0072B2"/>
    <rect x="150" y="120" width="30" height="20" fill="#0072B2"/>
    <rect x="0" y="0" width="4" height="460" fill="#111"/>
    <rect x="95" y="0" width="4" height="460" fill="#E69F00"/>
    <rect x="-2" y="196" width="204" height="10" fill="none" stroke="#c2185b" stroke-width="2"/>
  </g>
  <g font-size="10" transform="translate(354,590)">
    <rect width="10" height="10" fill="#eeeeee" stroke="#999"/><text x="14" y="9">both succeed</text>
    <rect x="90" width="10" height="10" fill="#8c8c8c"/><text x="104" y="9">both fail</text>
    <rect y="16" width="10" height="10" fill="#D55E00"/><text x="14" y="25">loss vs R</text>
    <rect x="90" y="16" width="10" height="10" fill="#0072B2"/><text x="104" y="25">gain vs R</text>
  </g>
  <text x="354" y="638" font-size="11" fill="#c2185b">click row → open episode in C, D</text>
  <text x="354" y="650" font-size="11" fill="#c2185b">click column → set Candidate</text>

  <!-- C workspace -->
  <rect x="594" y="56" width="598" height="330" rx="4" fill="none" stroke="#555"/>
  <text x="602" y="74" font-weight="bold">C · Workspace Replay (seed 1023)   R | C juxtaposed, same scale</text>
  <g transform="translate(612,86)">
    <rect width="270" height="250" fill="#fafafa" stroke="#999"/>
    <text x="4" y="14" font-size="11">R  sync · d0 · h8   ✓ success</text>
    <path d="M110,110 h60 v15 h-22 v55 h-16 v-55 h-22 z" fill="none" stroke="#009E73" stroke-width="2" stroke-dasharray="5 3" transform="rotate(45 140 140)"/>
    <path d="M90,120 h60 v15 h-22 v55 h-16 v-55 h-22 z" fill="#bbb" transform="rotate(30 120 150)"/>
    <path d="M40,220 C70,200 90,190 110,170 S150,130 170,120" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="170" cy="120" r="7" fill="#333"/>
  </g>
  <g transform="translate(902,86)">
    <rect width="270" height="250" fill="#fafafa" stroke="#999"/>
    <text x="4" y="14" font-size="11">C  naive · d4 · h8   ✗ failure</text>
    <path d="M110,110 h60 v15 h-22 v55 h-16 v-55 h-22 z" fill="none" stroke="#009E73" stroke-width="2" stroke-dasharray="5 3" transform="rotate(45 140 140)"/>
    <path d="M90,140 h60 v15 h-22 v55 h-16 v-55 h-22 z" fill="#bbb" transform="rotate(-10 120 170)"/>
    <path d="M40,220 C70,200 90,195 115,180 L150,150" fill="none" stroke="#E69F00" stroke-width="2"/>
    <path d="M150,150 L165,140 L180,128 L192,118" fill="none" stroke="#E69F00" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M150,150 L160,160 L172,170 L182,178 L190,185" fill="none" stroke="#E69F00" stroke-opacity="0.5" stroke-width="5"/>
    <circle cx="150" cy="150" r="7" fill="#E69F00"/>
    <text x="96" y="222" font-size="10">fan = active chunk (16 planned pts)</text>
    <text x="96" y="236" font-size="10">thick = executed, dashed = discarded</text>
  </g>
  <rect x="612" y="346" width="560" height="10" rx="5" fill="#eee" stroke="#999"/>
  <circle cx="800" cy="351" r="7" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="612" y="378" font-size="11">▶ play   ⟲ scrub t = 0 … 300 (10 Hz)        hover a fan point → planned-at step, staleness</text>

  <!-- D timeline -->
  <rect x="594" y="394" width="598" height="258" rx="4" fill="none" stroke="#555"/>
  <text x="602" y="412" font-weight="bold">D · Chunk Provenance Timeline</text>
  <g transform="translate(640,426)">
    <text x="-36" y="18" font-size="11">R</text>
    <g fill="#333"><rect x="0" y="10" width="40" height="10"/><rect x="42" y="10" width="40" height="10"/><rect x="84" y="10" width="40" height="10"/><rect x="126" y="10" width="40" height="10"/><rect x="168" y="10" width="40" height="10"/><rect x="210" y="10" width="40" height="10"/></g>
    <g stroke="#D55E00" stroke-width="2"><line x1="41" y1="0" x2="41" y2="8"/><line x1="83" y1="2" x2="83" y2="8"/><line x1="125" y1="-4" x2="125" y2="8"/></g>
    <text x="-36" y="58" font-size="11">C</text>
    <g><line x1="0" y1="54" x2="20" y2="54" stroke="#E69F00"/><rect x="20" y="50" width="40" height="10" fill="#E69F00"/>
      <line x1="40" y1="44" x2="60" y2="44" stroke="#E69F00"/><rect x="60" y="50" width="40" height="10" fill="#E69F00" opacity="0.7"/>
      <rect x="100" y="50" width="40" height="10" fill="#E69F00"/><rect x="140" y="50" width="40" height="10" fill="#E69F00" opacity="0.7"/></g>
    <g stroke="#D55E00" stroke-width="2"><line x1="60" y1="30" x2="60" y2="48"/><line x1="100" y1="40" x2="100" y2="48"/><line x1="140" y1="26" x2="140" y2="48"/></g>
    <rect x="0" y="64" width="20" height="8" fill="url(#hatch)"/>
    <text x="270" y="18" font-size="10">thin line = waiting for inference (t_obs → t_avail)</text>
    <text x="270" y="32" font-size="10">bar = executed span of a chunk</text>
    <text x="270" y="46" font-size="10">vermillion tick height = seam gap (px)</text>
    <text x="270" y="60" font-size="10">hatched = robot idle (no action available)</text>
    <path d="M0,170 C40,165 80,150 120,120 S200,100 240,95 S320,90 520,88" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M0,170 C40,166 80,160 120,150 S200,140 240,150 S320,160 520,165" fill="none" stroke="#E69F00" stroke-width="2"/>
    <line x1="0" y1="85" x2="520" y2="85" stroke="#009E73" stroke-dasharray="4 3"/>
    <text x="440" y="80" font-size="10" fill="#009E73">success = 95%</text>
    <text x="-36" y="130" font-size="10">cov.</text>
    <line x1="160" y1="0" x2="160" y2="175" stroke="#c2185b" stroke-width="1.5"/>
    <rect x="100" y="-2" width="90" height="180" fill="#c2185b" fill-opacity="0.06" stroke="#c2185b" stroke-dasharray="4 3"/>
    <line x1="0" y1="178" x2="520" y2="178" stroke="#333"/><text x="230" y="196" font-size="10">time step t (10 Hz) →</text>
  </g>
  <text x="602" y="640" font-size="11" fill="#c2185b">brush time → show only that window in C · hover chunk → highlight its fan in C · red line = scrub cursor</text>

  <!-- linking arrows -->
  <path d="M338,180 C345,180 340,140 352,140" fill="none" stroke="#c2185b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M586,320 C600,320 600,250 610,250" fill="none" stroke="#c2185b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M586,330 C620,380 600,470 630,470" fill="none" stroke="#c2185b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M338,470 C350,470 345,380 360,370" fill="none" stroke="#c2185b" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M900,394 L900,358" fill="none" stroke="#c2185b" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
